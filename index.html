<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>REEL RUNNER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="arcade-game.css" />
  <style>
    html,body{margin:0;min-height:100%;background:#02030a;color:#fff;font-family:'Press Start 2P',monospace}
    body.skin-arcade{display:grid;place-items:center;min-height:100dvh;padding:20px;box-sizing:border-box}
    .test-shell{width:min(680px,94vw);text-align:center;border:4px solid #176fe8;background:#030812;box-shadow:0 0 0 4px #ff2a6d,0 0 0 8px #ffb000;padding:24px 18px;box-sizing:border-box}
    h1{font-size:clamp(18px,6vw,34px);color:#ffe21f;text-shadow:3px 3px 0 #ff4f00;margin:0 0 18px}
    p{font-size:9px;line-height:1.8;color:#30a8ff}
    footer{margin-top:24px}
    .arcade-game-launch{font-size:11px!important;border:3px solid #fff56b!important;background:#ffe21f!important;color:#111!important;padding:14px 16px!important;box-shadow:inset 0 -4px 0 #c87b00!important}
  </style>
</head>
<body class="skin-arcade">
  <main class="test-shell">
    <h1>REEL RUNNER</h1>
    <p>IPHONE TEST BUILD</p>
    <footer></footer>
  </main>
  <script src="arcade-game.js"></script>
</body>
</html>
