<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Man With A Movie Camera</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#020308;color:#eee;font-family:Arial,Helvetica,sans-serif;overflow:hidden}body{min-height:100dvh}.shell{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 0,#161b2d,#020308 58%)}header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 14px 9px;background:linear-gradient(#0d111b,#05070d);border-bottom:1px solid #33415d}.brand{font-weight:900;letter-spacing:.12em;font-size:clamp(12px,2.6vw,20px);color:#f4d36d;text-shadow:0 2px #5b3412}.hud{font:700 11px ui-monospace,monospace;color:#98d8ff;white-space:nowrap}.stage{display:grid;place-items:center;min-height:0;padding:8px}.frame{position:relative;width:min(100%,1100px);aspect-ratio:16/9;border:3px solid #7083aa;box-shadow:0 0 0 3px #111827,0 12px 60px #000;background:#000;overflow:hidden}.frame canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.frame:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:7;background:linear-gradient(#fff1 50%,#0001 50%);background-size:100% 3px;mix-blend-mode:overlay;opacity:.35}.overlay{position:absolute;inset:0;z-index:8;overflow:auto;background:radial-gradient(circle at 50% 20%,rgba(26,34,58,.97),rgba(2,3,8,.98) 70%);padding:20px}.title{text-align:center;margin:10px auto 18px;max-width:900px}.eyebrow{font:800 10px ui-monospace,monospace;letter-spacing:.18em;color:#84cfff}.title h1{margin:8px 0 6px;font-size:clamp(28px,7vw,64px);line-height:.92;letter-spacing:-.04em;color:#f2d57b;text-shadow:4px 4px #49250d}.title p{margin:8px auto;max-width:700px;font-size:12px;line-height:1.45;color:#c4d8ee}.levels{max-width:960px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.level{appearance:none;text-align:left;border:1px solid #617391;background:linear-gradient(145deg,#121a2b,#080c15);color:#fff;padding:12px;min-height:112px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff08}.level:active{transform:translateY(1px)}.level b{display:block;font-size:16px;letter-spacing:.04em;margin-bottom:6px}.level small{display:block;color:#b9cbe0;font-size:10px;line-height:1.35}.level em{position:absolute;right:10px;bottom:8px;font:900 9px ui-monospace,monospace;color:#f5d773}.level[data-i="0"]{background:linear-gradient(145deg,#25121b,#09070d)}.level[data-i="1"]{filter:grayscale(1);background:linear-gradient(145deg,#464646,#090909)}.level[data-i="2"]{background:linear-gradient(145deg,#173944,#0a171d)}.level[data-i="3"]{background:linear-gradient(145deg,#3a1e1b,#111b2c)}.level[data-i="4"]{background:linear-gradient(145deg,#13264a,#090d22)}.level[data-i="5"]{background:linear-gradient(145deg,#563215,#17100b)}.level[data-i="6"]{background:linear-gradient(145deg,#41213a,#150b15)}.level[data-i="7"]{background:linear-gradient(145deg,#31401b,#10150b)}.level[data-i="8"]{background:linear-gradient(145deg,#3d2747,#14101c)}.toast{position:absolute;z-index:9;left:50%;top:12%;transform:translateX(-50%);background:#05070de8;border:1px solid #d9e4f5;color:#fff;font:800 11px ui-monospace,monospace;padding:9px 12px;display:none;white-space:nowrap}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:8px 10px max(10px,env(safe-area-inset-bottom));background:#05070d;border-top:1px solid #33415d}.controls button{appearance:none;border:1px solid #4d648a;background:linear-gradient(#17223a,#0b1221);color:#fff;font-weight:900;font-size:17px;padding:13px 5px;touch-action:none}.controls button:active{background:#e4c457;color:#111}.legend{text-align:center;background:#05070d;color:#7897bd;font:700 9px ui-monospace,monospace;padding-bottom:4px}.menuBtn{position:absolute;z-index:10;right:10px;top:10px;border:1px solid #7890b6;background:#07101dcc;color:#fff;font:800 10px ui-monospace,monospace;padding:7px 9px;display:none}@media(max-width:760px){.overlay{padding:12px}.levels{grid-template-columns:1fr 1fr;gap:7px}.le </style></head><body><div class="shell"><header><div class="brand">MAN WITH A MOVIE CAMERA</div><div class="hud" id="hud">SELECT A REEL</div></header><main class="stage"><div class="frame"><canvas id="game" width="960" height="540"></canvas><div class="toast" id="toast"></div><button class="menuBtn" id="menuBtn">REELS</button><div class="overlay" id="overlay"><div class="title"><div class="eyebrow">DM ARCADE SYSTEM · FEATURE PRESENTATION</div><h1>MAN WITH A<br>MOVIE CAMERA</h1><p>A genre-hopping 32-bit arcade film. Every reel plays by different cinematic rules. Choose any level.</p></div><div class="levels" id="levels"></div></div></div></main><div><div class="controls"><button data-k="left">◀</button><button data-k="jump">▲</button><button data-k="action">●</button><button data-k="right">▶</button></div><div class="legend">MOVE · JUMP / CLIMB · CAMERA / ATTACK</div></div></div><script>
(()=>{const C=document.getElementById('game'),g=C.getContext('2d'),ov=document.getElementById('overlay'),levelsEl=document.getElementById('levels'),hud=document.getElementById('hud'),toast=document.getElementById('toast'),menuBtn=document.getElementById('menuBtn');g.imageSmoothingEnabled=false;const W=960,H=540,G=424,keys={left:0,right:0,jump:0,action:0};let state='menu',level=0,score=0,lives=3,last=performance.now(),time=0,cam=0,objective=0,flash=0,shake=0,p=null,enemies=[],shots=[],moments=[],fx=[];
const reels=[{name:'HORROR',tag:'THE BLACK HOUSE',desc:'Storm a decaying estate. Flash vampires, ghosts, demons and the creature in the cellar.',type:'combat',goal:12},{name:'NOIR',tag:'CITY OF SHADOWS',desc:'Rain, alleys and gangsters. Photograph evidence and capture mob lieutenants alive.',type:'capture',goal:9},{name:'DOCUMENTARY',tag:'ONE DAY ON EARTH',desc:'Film fragile moments: birth, arrest, victory, protest, reunion and disaster.',type:'film',goal:7},{name:'ACTION',tag:'HARD TARGET',desc:'Rooftops, mercenaries, moving trucks, gunfire and a helicopter escape.',type:'combat',goal:15},{name:'SCI-FI',tag:'ORBITAL 9',desc:'A derelict station. Zero-gravity shafts, drones, aliens and a reactor core.',type:'combat',goal:11},{name:'WESTERN',tag:'LAST LIGHT',desc:'Cross a desert town at sundown. Duels, horses, bandits and a runaway train.',type:'capture',goal:10},{name:'ROMANCE',tag:'BEFORE THE TRAIN',desc:'Race across a rain-soaked city to capture moments that reconnect two lovers.',type:'film',goal:6},{name:'WAR',tag:'HILL 317',desc:'Move upward through trenches under fire and document a squad reaching the ridge.',type:'combat',goal:13},{name:'MUSICAL',tag:'ONE TAKE',desc:'Hit moving marks in rhythm as the city transforms into a giant choreographed set.',type:'film',goal:8}];
reels.forEach((r,i)=>{const b=document.createElement('button');b.className='level';b.dataset.i=i;b.innerHTML=`<b>${String(i+1).padStart(2,'0')} · ${r.name}</b><small>${r.desc}</small><em>${r.tag}</em>`;b.onclick=()=>begin(i);levelsEl.appendChild(b)});menuBtn.onclick=showMenu;const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));function rect(x,y,w,h,c,a=1){g.globalAlpha=a;g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));g.globalAlpha=1}function line(x1,y1,x2,y2,c,w=1,a=1){g.globalAlpha=a;g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.globalAlpha=1}function text(s,x,y,size=16,c='#fff',align='left'){g.fillStyle=c;g.font=`800 ${size}px Arial`;g.textAlign=align;g.fillText(s,x,y)}function msg(s){toast.textContent=s;toast.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>toast.style.display='none',950)}function showMenu(){state='menu';ov.style.display='block';menuBtn.style.display='none';hud.textContent='SELECT A REEL'}function resetPlayer(){p={x:110,y:G-70,w:34,h:66,vx:0,vy:0,on:0,face:1,inv:0}}function begin(i){level=i;state='play';score=0;lives=3;time=0;cam=0;flash=0;shake=0;enemies=[];shots=[];moments=[];fx=[];objective=reels[i].goal;resetPlayer();ov.style.display='none';menuBtn.style.display='block';setup(i);msg(`${reels[i].name} · ${objective} TO GO`)}
function setup(i){let kinds=[];if(i===0)kinds=['vampire','ghost','demon','werewolf'];if(i===1)kinds=['gangster','detective'];if(i===3)kinds=['merc','merc','heavy'];if(i===4)kinds=['drone','alien','drone'];if(i===5)kinds=['bandit','bandit','gunslinger'];if(i===7)kinds=['soldierE','gunner'];if(kinds.length){for(let q=0;q<reels[i].goal+2;q++)enemies.push({type:kinds[q%kinds.length],x:470+q*220+R(-40,55),y:G-58,hp:['heavy','werewolf','alien','gunner'].includes(kinds[q%kinds.length])?2:1,v:R(28,68),phase:R(0,6.2)})}if(i===2)moments=['BIRTH','ARREST','VICTORY','PROTEST','REUNION','FIRE RESCUE','FIRST STEPS'].map((n,q)=>({name:n,x:430+q*400,y:G-50,done:0}));if(i===6)moments=['MISSED TRAIN','UMBRELLA','PHONE CALL','FLOWER STALL','BRIDGE','PLATFORM'].map((n,q)=>({name:n,x:450+q*440,y:G-50,done:0}));if(i===8)moments=['TAXI','CROSSWALK','DINER','STAIRCASE','ROOFTOP','SUBWAY','MARQUEE','FINALE'].map((n,q)=>({name:n,x:420+q*340,y:G-50,done:0}))}
function hurt(){if(p.inv>0)return;p.inv=1.2;lives--;shake=.25;flash=.14;p.vy=-190;p.vx=-p.face*150;if(lives<=0){lives=3;score=Math.max(0,score-500);const hold=level;begin(hold);msg('CUT. RETAKE.')}}function burst(x,y,c,n=13){for(let i=0;i<n;i++)fx.push({x,y,vx:R(-130,130),vy:R(-190,45),life:R(.3,.85),c,s:R(1,4)})}function shoot(){const type=reels[level].type==='combat'&&![0,4].includes(level)?'bullet':'camera';shots.push({x:p.x+p.face*28,y:p.y+25,vx:p.face*(type==='bullet'?700:540),life:type==='bullet'?1:.25,type});if(type==='camera')flash=.09}
function update(dt){if(state!=='play')return;time+=dt;p.inv=Math.max(0,p.inv-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);const acc=level===3?610:500,max=level===3?250:220;if(keys.left){p.vx-=acc*dt;p.face=-1}if(keys.right){p.vx+=acc*dt;p.face=1}if(!keys.left&&!keys.right)p.vx*=Math.pow(.002,dt);p.vx=cl(p.vx,-max,max);if(keys.jump&&p.on){p.vy=level===4?-420:-365;p.on=0;keys.jump=0}p.vy+=(level===4?490:790)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y+p.h>=G){p.y=G-p.h;p.vy=0;p.on=1}p.x=Math.max(20,p.x);cam=Math.max(0,p.x-270);if(keys.action&&!keys._a){shoot();keys._a=1}if(!keys.action)keys._a=0;shots.forEach(s=>{s.x+=s.vx*dt;s.life-=dt});shots=shots.filter(s=>s.life>0);enemies.forEach(e=>{if(e.hp<=0)return;const dx=p.x-e.x;e.phase+=dt*3;if(level!==1||e.type!=='detective')e.x+=Math.sign(dx)*e.v*dt*(Math.abs(dx)<420?1:.25);if(Math.abs(dx)<40&&Math.abs(p.y-e.y)<60)hurt();shots.forEach(s=>{if(s.life>0&&Math.abs(s.x-e.x)<34&&Math.abs(s.y-(e.y+25))<44){s.life=0;e.hp--;if(e.hp<=0){objective--;score+=level===1?220:150;burst(e.x,e.y,level===0?'#d94565':'#f1c96b');msg(level===1?'EVIDENCE SECURED':level===0?'EXPOSED':level===5?'OUTDRAWN':'TARGET DOWN')}}})});enemies=enemies.filter(e=>e.hp>0);if(moments.length)moments.forEach(m=>{if(!m.done&&Math.abs(p.x-m.x)<105&&keys.action){m.done=1;objective--;score+=300;burst(m.x,m.y,'#f7df85',18);msg(`FILMED: ${m.name}`)}});fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=300*dt;f.life-=dt});fx=fx.filter(f=>f.life>0);if(objective<=0){state='clear';setTimeout(()=>{showMenu();msg(`${reels[level].name} COMPLETE · ${score}`)},600)}hud.textContent=`${reels[level].name} · ${objective} LEFT · ${score} · LIVES ${lives}`}
function skyGradient(top,bot){const gr=g.createLinearGradient(0,0,0,G);gr.addColorStop(0,top);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,W,H)}function cityLayer(speed,y,c1,c2,scale=1){for(let i=0;i<14;i++){const xx=((i*121-cam*speed)%1800+1800)%1800-140,h=(110+(i*47)%170)*scale,w=(70+(i*31)%100)*scale;rect(xx,y-h,w,h,c1);for(let yy=y-h+18;yy<y-15;yy+=25)for(let wx=xx+12;wx<xx+w-8;wx+=24)rect(wx,yy,7,11,c2,.4+(i%3)*.15)}}function tree(x,y,s,c='#14121c'){rect(x-5*s,y-46*s,10*s,46*s,'#241a17');g.fillStyle=c;g.beginPath();g.arc(x,y-64*s,30*s,0,Math.PI*2);g.arc(x-20*s,y-46*s,22*s,0,Math.PI*2);g.arc(x+20*s,y-43*s,24*s,0,Math.PI*2);g.fill()}
function bg(){const i=level;if(i===0){skyGradient('#080714','#2b1830');for(let q=0;q<5;q++){const xx=((q*310-cam*.18)%1700+1700)%1700-150;tree(xx,370,2,'#100c17')}rect(0,G,W,H-G,'#100d12');for(let q=0;q<7;q++){const xx=((q*280-cam*.65)%1900+1900)%1900-100;rect(xx,286,190,138,'#17131b');rect(xx+18,315,28,45,'#572f37');rect(xx+78,305,20,33,'#d8ad67',.35);line(xx+95,286,xx+95,424,'#2d2331',3)}for(let q=0;q<80;q++){let rx=(q*149+time*220)%1100,ry=(q*83+time*410)%580;line(rx,ry,rx-8,ry+18,'#b6c8da',1,.28)}}else if(i===1){skyGradient('#b9bcc0','#33363a');cityLayer(.15,390,'#5b5d60','#e8e8e8');cityLayer(.42,420,'#232427','#d9d9d9');rect(0,G,W,H-G,'#0d0e10');for(let q=0;q<90;q++){let rx=(q*113+time*180)%1080,ry=(q*57+time*420)%580;line(rx,ry,rx-13,ry+22,'#e9e9e9',1,.25)}}else if(i===2){skyGradient('#73b6d0','#e2c889');cityLayer(.18,408,'#6f8583','#e8d69c');rect(0,G,W,H-G,'#73604c');for(let q=0;q<8;q++){const xx=((q*300-cam*.65)%2200+2200)%2200-120;rect(xx,330,170,94,['#98715a','#6b8179','#b4865e'][q%3]);rect(xx+24,300,55,32,'#d6c4a4')}}else if(i===3){skyGradient('#e45e45','#272c50');cityLayer(.13,385,'#49324b','#f0a25b');cityLayer(.48,422,'#1c2335','#efc56f');rect(0,G,W,H-G,'#181b22');for(let q=0;q<5;q++){const xx=((q*440-cam*.8)%2100+2100)%2100-150;rect(xx,395,260,29,'#303b49');rect(xx+20,372,110,24,'#53687c')}}else if(i===4){const gr=g.createRadialGradient(500,180,10,500,180,500);gr.addColorStop(0,'#173a74');gr.addColorStop(.5,'#080b23');gr.addColorStop(1,'#010208');g.fillStyle=gr;g.fillRect(0,0,W,H);for(let q=0;q<130;q++)rect((q*173-cam*.05)%1000,(q*67)%390,q%9?1:2,q%9?1:2,q%11?'#dcecff':'#66b9ff');for(let q=0;q<6;q++){const xx=((q*320-cam*.6)%2200+2200)%2200-180;rect(xx,230,260,194,'#20293a');rect(xx+20,250,220,18,'#4d647c');for(let yy=285;yy<405;yy+=38)for(let wx=xx+28;wx<xx+230;wx+=45)rect(wx,yy,22,18,'#5fc7d7',.45)}rect(0,G,W,H-G,'#0d121b')}else if(i===5){skyGradient('#db8b4b','#f1c57d');for(let q=0;q<7;q++){const xx=((q*390-cam*.2)%2400+2400)%2400-200;rect(xx,330,300,94,'#9a5f32');rect(xx+70,290,70,40,'#71442c')}rect(0,G,W,H-G,'#9b6636');for(let q=0;q<9;q++){let xx=((q*260-cam*.7)%2200+2200)%2200-120;rect(xx,350,160,74,'#7b4a2a');rect(xx+20,320,90,30,'#ad7540');rect(xx+55,365,30,59,'#301f18')}}else if(i===6){skyGradient('#2f3353','#9f617d');cityLayer(.15,390,'#463d55','#ffc693');cityLayer(.5,422,'#262637','#f7c4a0');rect(0,G,W,H-G,'#17171e');for(let q=0;q<70;q++){let rx=(q*101+time*130)%1040,ry=(q*71+time*330)%570;line(rx,ry,rx-5,ry+13,'#aac8de',1,.3)}}else if(i===7){skyGradient('#60664b','#c0aa79');for(let q=0;q<8;q++){const xx=((q*330-cam*.25)%2100+2100)%2100-150;rect(xx,330,300,94,'#5d604e');tree(xx+60,355,1.4,'#3e4932')}rect(0,G,W,H-G,'#343323');for(let q=0;q<8;q++){let xx=((q*250-cam*.7)%2100+2100)%2100-100;rect(xx,390,180,34,'#403c2b');line(xx,390,xx+180,390,'#8c8063',4)}}else{skyGradient('#39274f','#e0637a');cityLayer(.16,390,'#51456a','#ffd168');cityLayer(.55,422,'#251e39','#f6b96d');rect(0,G,W,H-G,'#191425');for(let q=0;q<9;q++){let xx=((q*270-cam*.72)%2200+2200)%2200-100;rect(xx,360,180,64,['#2d3957','#793a55','#805e35'][q%3]);rect(xx+25,335,110,25,'#f0c36c')}}}
function person(px,py,style='hero',face=1){const sx=Math.round(px-cam),sy=Math.round(py);if(style==='ghost'){g.globalAlpha=.7;rect(sx,sy,34,58,'#dcecff');rect(sx+7,sy+10,5,7,'#27303b');rect(sx+22,sy+10,5,7,'#27303b');g.globalAlpha=1;return}let skin='#c98e68',coat='#345b8c',pants='#20242a',hair='#30221b';if(['gangster','detective'].includes(style)){coat='#222';pants='#111';hair='#111'}if(style==='merc'){coat='#59604c';pants='#2e332a'}if(style==='heavy'){coat='#343a3f';pants='#111'}if(style==='vampire'){coat='#2a1420';pants='#111';hair='#111'}if(style==='demon'){coat='#8f2731';pants='#401318';hair='#401318'}if(style==='werewolf'){coat='#5f4b3e';pants='#312821';hair='#3b2b22'}if(style==='drone'){rect(sx-8,sy+10,50,28,'#6c859b');rect(sx+3,sy+17,28,10,'#9fdcff');line(sx-7,sy+24,sx-22,sy+4,'#7592ac',4);line(sx+42,sy+24,sx+57,sy+4,'#7592ac',4);return}if(style==='alien'){skin='#8bb1a0';coat='#43544f';pants='#1d2522';hair='#45675c'}if(['bandit','gunslinger'].includes(style)){coat=style==='gunslinger'?'#33221b':'#705134';pants='#3a2b23';hair='#3a241c'}if(['soldierE','gunner'].includes(style)){coat='#626a46';pants='#343a28';hair='#29291e'}if(style==='hero'&&level===3){coat='#7a3e2e';pants='#252b32'}if(style==='hero'&&level===4){coat='#c8d5de';pants='#4c6174'}if(style==='hero'&&level===5){coat='#9a673d';pants='#483325'}if(style==='hero'&&level===7){coat='#66704e';pants='#343b2d'}rect(sx+7,sy+48,9,18,pants);rect(sx+22,sy+48,9,18,pants);rect(sx+5,sy+20,28,31,coat);rect(sx+9,sy+2,22,22,skin);rect(sx+8,sy,24,7,hair);rect(sx+(face>0?27:-3),sy+26,15,7,coat);if(['gangster','merc','heavy','bandit','gunslinger','soldierE','gunner'].includes(style))rect(sx+(face>0?37:-13),sy+27,15,5,'#15181c');rect(sx+(face>0?26:11),sy+10,3,2,'#171717');if(style==='vampire'){rect(sx+9,sy+22,4,16,'#8b1530');rect(sx+27,sy+22,4,16,'#8b1530')}if(style==='demon'){line(sx+10,sy+3,sx+4,sy-10,'#d2b35d',3);line(sx+28,sy+3,sx+34,sy-10,'#d2b35d',3)}}function drawMoment(m){if(m.done)return;const sx=m.x-cam;rect(sx-42,G-100,84,72,'#101419',.45);line(sx-36,G-26,sx+36,G-26,'#f5d56b',2,.6);text(m.name,sx,G-112,10,'#f5d56b','center');person(m.x-20,G-70,'hero',1);person(m.x+18,G-70,level===6?'detective':'hero',-1)}function draw(){g.save();if(shake>0)g.translate(R(-5,5),R(-3,3));bg();moments.forEach(drawMoment);enemies.forEach(e=>person(e.x,e.y,e.type,Math.sign(p.x-e.x)||1));if(p)person(p.x,p.y,'hero',p.face);shots.forEach(s=>{const sx=s.x-cam;if(s.type==='bullet'){rect(sx,s.y,11,3,'#ffe29c');line(sx-16,s.y+1,sx,s.y+1,'#ff8c42',2,.6)}else{rect(sx-2,s.y-2,5,5,'#fff');g.globalAlpha=.3;g.fillStyle='#fff';g.beginPath();g.arc(sx,s.y,20,0,Math.PI*2);g.fill();g.globalAlpha=1}});fx.forEach(f=>rect(f.x-cam,f.y,f.s,f.s,f.c,Math.max(0,f.life*1.5)));if(flash>0)rect(0,0,W,H,'#fff',flash*5);g.restore();if(state==='play'){const reel=reels[level];text(reel.tag,20,30,13,'#f4d36d');text(`${objective} LEFT`,W-20,30,13,'#c9e8ff','right');rect(20,45,210,5,'#172238');rect(20,45,210*Math.min(1,(reel.goal-objective)/reel.goal),5,'#f0cb64')}}function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();keys[k]=1},off=e=>{e.preventDefault();keys[k]=0};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=1;if(e.key==='ArrowRight'||e.key==='d')keys.right=1;if(e.key==='ArrowUp'||e.key==='w')keys.jump=1;if(e.code==='Space')keys.action=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=0;if(e.key==='ArrowRight'||e.key==='d')keys.right=0;if(e.key==='ArrowUp'||e.key==='w')keys.jump=0;if(e.code==='Space')keys.action=0})})();
</script></body></html>
