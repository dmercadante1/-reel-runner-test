<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Man With A Movie Camera</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050509;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.shell{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:#080812}header{padding:max(9px,env(safe-area-inset-top)) 12px 7px;background:linear-gradient(#17172a,#070710);border-bottom:3px solid #422d79;display:flex;justify-content:space-between}.brand{font-weight:900;font-style:italic;color:#ffd84a;text-shadow:2px 2px #a22b42;font-size:clamp(13px,3vw,22px)}.hud{font:800 10px monospace;color:#65d7ff}.stage{display:grid;place-items:center;min-height:0;padding:5px}.frame{position:relative;width:min(100%,1100px);aspect-ratio:16/9;background:#000;border:4px solid #33265f;box-shadow:0 0 0 3px #b53175;overflow:hidden}.frame canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}.frame:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#fff1 50%,#0001 50%);background-size:100% 3px;opacity:.25}.overlay{position:absolute;inset:0;z-index:8;overflow:auto;padding:14px;background:radial-gradient(circle at 50% 25%,#272442f5,#070711fc 75%)}.title{text-align:center}.title h1{margin:5px 0;font-size:clamp(27px,7vw,61px);font-style:italic;line-height:.9;color:#ffd84a;text-shadow:4px 4px #a22b42}.title p{font-size:11px;color:#a8d8ff}.levels{max-width:940px;margin:12px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.level{appearance:none;text-align:left;border:3px solid #3b4d89;background:#12152b;color:white;padding:10px;min-height:92px;box-shadow:inset -4px -4px #080a18,inset 3px 3px #6576b5}.level b{display:block;color:#ffe067;font-size:14px}.level small{font-size:9px;line-height:1.25;color:#b9d8ee}.level em{display:block;margin-top:5px;color:#ff73ad;font:800 8px monospace} n'],['DOCUMENTARY','ONE DAY ON EARTH','Birth · arrest · victory · protest'],['ACTION','HARD TARGET','Rooftops · mercenaries · trucks · chopper'],['SCI-FI','ORBITAL 9','Aliens · drones · reactor · zero-G'],['WESTERN','LAST LIGHT','Bandits · saloon · horses · train'],['ROMANCE','BEFORE THE TRAIN','Rain · taxis · station · lovers'],['WAR','HILL 317','Trenches · bunkers · ridge assault'],['MUSICAL','ONE TAKE','Broadway · dancers · marquees · finale']];reels.forEach((r,i)=>{let b=document.createElement('button');b.className='level';b.innerHTML=`<b>${String(i+1).padStart(2,'0')} ${r[0]}</b><small>${r[2]}</small><em>${r[1]}</em>`;b.onclick=()=>begin(i);lev.appendChild(b)});let state='menu',L=0,p,en=[],shots=[],mom=[],fx=[],cam=0,last=performance.now(),goal=0,lives=3,score=0,time=0,shake=0;function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function line(x1,y1,x2,y2,col,w=1){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}function msg(s){toast.textContent=s;toast.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>toast.style.display='none',850)}function showMenu(){state='menu';ov.style.display='block';menu.style.display='none';hud.textContent='SELECT REEL'}menu.onclick=showMenu;function begin(i){L=i;state='play';ov.style.display='none';menu.style.display='block';p={x:80,y:G-70,vx:0,vy:0,on:0,face:1,inv:0};cam=0;lives=3;score=0;time=0;en=[];shots=[];mom=[];fx=[];goal=[10,8,7,13,10,9,6,12,8][i];const kinds=[['vamp','ghost','demon'],['gangster'],[],['merc','heavy'],['alien','drone'],['bandit'],[],['soldier'],[]][i];for(let q=0;q<goal+1;q++)if(kinds.length)en.push({type:kinds[q%kinds.length],x:340+q*165,y:G-62,hp:['demon','heavy','alien'].includes(kinds[q%kinds.length])?2:1,v:R(22,45),phase:R(0,6)});if(!kinds.length)for(let q=0;q<goal;q++)mom.push({x:340+q*235,name:['BIRTH','ARREST','VICTORY','PROTEST','REUNION','KISS','FINALE','DANCE'][q%8],done:0});msg(reels[L][0]+' · '+goal+' TO GO')}function burst(x,y,col){for(let i=0;i<12;i++)fx.push({x,y,vx:R(-90,90),vy:R(-120,30),life:R(.3,.7),col})}function attack(){let bullet=[3,5,7].includes(L);shots.push({x:p.x+p.face*30,y:p.y+30,vx:p.face*(bullet?500:400),life:bullet?1:.25});if(!bullet)burst(p.x+p.face*35,p.y+28,'#fff')}function hurt(){if(p.inv)return;p.inv=1;lives--;shake=.2;p.vy=-140;if(lives<=0)begin(L)}function update(dt){if(state!=='play')return;time+=dt;p.inv=Math.max(0,p.inv-dt);shake=Math.max(0,shake-dt);if(K.left){p.vx-=360*dt;p.face=-1}if(K.right){p.vx+=360*dt;p.face=1}if(!K.left&&!K.right)p.vx*=Math.pow(.003,dt);p.vx=cl(p.vx,-165,165);if(K.jump&&p.on){p.vy=-270;p.on=0;K.jump=0}p.vy+=580*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y+70>=G){p.y=G-70;p.vy=0;p.on=1}cam=Math.max(0,p.x-180);if(K.action&&!K.a){attack();K.a=1}if(!K.action)K.a=0;shots.forEach(s=>{s.x+=s.vx*dt;s.life-=dt});shots=shots.filter(s=>s.life>0);en.forEach(e=>{e.phase+=dt*4;let dx=p.x-e.x;e.x+=Math.sign(dx)*e.v*dt;if(Math.abs(dx)<30)hurt();shots.forEach(s=>{if(s.life>0&&Math.abs(s.x-e.x)<27){s.life=0;if(--e.hp<=0){goal--;score+=150;burst(e.x,e.y,'#ffdf69');msg(L===0?'MONSTER EXPOSED':L===1?'CAPTURED':'TARGET DOWN')}}})});en=en.filter(e=>e.hp>0);mom.forEach(m=>{if(!m.done&&Math.abs(p.x-m.x)<75&&K.action){m.done=1;goal--;score+=250;burst(m.x,G-50,'#fff17a');msg('FILMED: '+m.name)}});fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=250*dt;f.life-=dt});fx=fx.filter(f=>f.life>0);if(goal<=0){msg('REEL COMPLETE');setTimeout(showMenu,650);goal=999}hud.textContent=reels[L][0]+' · '+goal+' LEFT · '+score+' · ♥'+lives}function grad(a,b){let q=g.createLinearGradient(0,0,0,G);q.addColorStop(0,a);q.addColorStop(1,b);g.fillStyle=q;g.fillRect(0,0,W,H)}function building(x,y,w,h,c,lit){rect(x,y,w,h,c);rect(x+3,y+3,w-6,3,'#ffffff18');for(let yy=y+14;yy<y+h-8;yy+=18)for(let xx=x+10;xx<x+w-8;xx+=18)rect(xx,yy,7,9,lit&&((xx+yy)%3)?'#e6c66d':'#15182a')}function parallax(){let pal=[['#120d28','#35152e','#4e2439'],['#151515','#777','#222']
