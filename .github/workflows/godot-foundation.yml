name: Godot 640 foundation - native check only
on:
  push:
    branches: [godot-640-foundation]
    paths: ['godot/**', '.github/workflows/godot-foundation.yml']
permissions:
  contents: read
concurrency:
  group: godot-640-foundation
  cancel-in-progress: true
jobs:
  native-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned official engine
        run: |
          curl --fail --location --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-engine
          chmod +x /tmp/godot-engine/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot-engine/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import and run native smoke tests, not web certification
        env:
          GODOT_SILENCE_ROOT_WARNING: '1'
        run: |
          set -o pipefail
          /tmp/godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/godot-import.log; then exit 1; fi
          timeout 30 /tmp/godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script tests/native_smoke.gd 2>&1 | tee /tmp/godot-native.log
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/godot-native.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-640-foundation-native-evidence
          path: |
            godot/tests/latest-native-results.json
            /tmp/godot-import.log
            /tmp/godot-native.log
          retention-days: 14
