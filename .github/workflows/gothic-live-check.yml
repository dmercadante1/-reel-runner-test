name: Verify served Gothic Horror R2
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'game/releases/gothic-hud-r2/**'
      - 'audit/check-live-gothic-r2.py'
      - '.github/workflows/gothic-live-check.yml'
permissions:
  contents: read
jobs:
  served-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Verify Pages content hash and actual-root Chromium/WebKit gameplay
        run: python audit/check-live-gothic-r2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gothic-r2-live-proof
          path: live-evidence/
          retention-days: 14
