name: Verify served Gothic Horror R3 and R4
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'game/releases/gothic-r3a/**'
      - 'game/releases/gothic-r4a/**'
      - 'audit/check-live-r34.py'
      - '.github/workflows/gothic-live-check.yml'
permissions:
  contents: read
jobs:
  served-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Verify Pages bytes and actual-root Chromium/WebKit desktop/mobile input and HUD
        run: python audit/check-live-r34.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gothic-r34-live-proof
          path: live-evidence/
          retention-days: 14
