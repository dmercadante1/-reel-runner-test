name: Archived Gothic R3 and R4 verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  served-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Check archived direct URLs rather than expecting the current root to remain R4
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('audit/check-live-r34.py');s=p.read_text()
          old="url=BASE if edition==4 else BASE+'game/releases/gothic-r3a/'"
          assert old in s
          p.write_text(s.replace(old,"url=BASE+f'game/releases/gothic-r{edition}a/'"))
          PY
          python audit/check-live-r34.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gothic-r34-archive-proof
          path: live-evidence/
          retention-days: 14
