name: Read-only forensic audit
on:
  push:
    branches: [forensic-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Audit unchanged repository and live Pages URL
        run: node audit/browser-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forensic-browser-evidence
          path: audit-results/
          retention-days: 7
