name: Godot M1 web export baseline
on:
  push:
    branches: [godot-640-foundation]
    paths: ['.github/workflows/godot-m1-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned official engine and web templates
        run: |
          mkdir -p /tmp/godot-toolkit
          curl --fail --location --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-toolkit
          curl --fail --location --retry 2 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          python - <<'PY'
          import pathlib,zipfile,hashlib,json
          dest=pathlib.Path.home()/'.local/share/godot/export_templates/4.7.2.stable';dest.mkdir(parents=True,exist_ok=True)
          kit=pathlib.Path('/tmp/godot-toolkit/templates');kit.mkdir()
          with zipfile.ZipFile('/tmp/templates.tpz') as z:
              for name in ['web_nothreads_debug.zip','web_nothreads_release.zip']:
                  data=z.read('templates/'+name);(dest/name).write_bytes(data);(kit/name).write_bytes(data)
          (dest/'version.txt').write_text('4.7.2.stable')
          p=pathlib.Path('/tmp/godot-toolkit');(p/'hashes.json').write_text(json.dumps({str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file()},indent=2))
          cfg=pathlib.Path('godot/export_presets.cfg');s=cfg.read_text();s+='\ncustom_template/release="/tmp/godot-toolkit/templates/web_nothreads_release.zip"\ncustom_template/debug="/tmp/godot-toolkit/templates/web_nothreads_debug.zip"\n';cfg.write_text(s)
          PY
          chmod +x /tmp/godot-toolkit/Godot_v4.7.2-stable_linux.x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-m1-reproducible-toolkit
          path: /tmp/godot-toolkit/
          compression-level: 1
          retention-days: 7
      - name: Import foundation and diagnose actual web export
        env:
          GODOT_SILENCE_ROOT_WARNING: 1
        run: |
          set -o pipefail
          mkdir -p build/godot-web-trial evidence
          /tmp/godot-toolkit/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --import --quit 2>&1 | tee evidence/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error' evidence/import.log
          /tmp/godot-toolkit/Godot_v4.7.2-stable_linux.x86_64 --headless --verbose --path godot --export-release 'Web Trial' ../build/godot-web-trial/index.html 2>&1 | tee evidence/export.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' evidence/export.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-m1-export-source
          path: |
            godot/
            build/godot-web-trial/
            evidence/
          retention-days: 14
