name: Godot M1 import export and browser proof
on:
  push:
    branches: [godot-640-foundation]
    paths: ['godot/**', '.github/workflows/godot-m1-export.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned engine and templates
        run: |
          curl -fL --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-engine
          curl -fL --retry 2 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          dest=Path.home()/'.local/share/godot/export_templates/4.7.2.stable';dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile('/tmp/templates.tpz') as z:
            for name in ['web_nothreads_debug.zip','web_nothreads_release.zip']:(dest/name).write_bytes(z.read('templates/'+name))
          PY
          echo '/tmp/godot-engine' >> "$GITHUB_PATH"
          chmod +x /tmp/godot-engine/Godot_v4.7.2-stable_linux.x86_64
          python3 -m pip install Pillow
          npm install --no-save playwright@1.62.1 pngjs
          npx playwright install --with-deps chromium webkit
      - name: Fresh assets, import, native regression and release export
        run: |
          set -o pipefail
          mkdir -p godot/evidence build/godot-m1
          python3 godot/tools/prepare_trial_assets.py
          Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --import --quit 2>&1 | tee godot/evidence/ci-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' godot/evidence/ci-import.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script tests/native_smoke.gd 2>&1 | tee godot/evidence/ci-native.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' godot/evidence/ci-native.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --export-release 'Web Trial' ../build/godot-m1/index.html 2>&1 | tee godot/evidence/ci-export.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' godot/evidence/ci-export.log
      - name: Real Chromium and WebKit input and rendered-output checks
        run: |
          python3 -m http.server 8765 --directory build/godot-m1 > /tmp/http.log 2>&1 &
          node godot/tests/browser.cjs
          python3 godot/tests/pixels.py
          python3 godot/tools/manifest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-m1-fresh-proof
          path: |
            godot/evidence/
            godot/tests/latest-native-results.json
            build/godot-m1/
          retention-days: 14