,82,165],seqs=[[0,3,7,10],[0,3,5,7],[0,4,7,9],[0,3,7,8],[0,2,7,10],[0,4,7,10],[0,4,7,11],[0,3,5,7],[0,4,7,9]],tem=[300,350,410,215,255,325,380,245,205];let n=0;timer=setInterval(()=>{tone(roots[i]*Math.pow(2,(seqs[i][n%4]+(n%8>3?12:0))/12),.09,i===1?'triangle':'square',.013);if((i===3||i===7)&&n%2===0)tone(roots[i]/2,.04,'square',.009);n++},tem[i])}sound.onclick=()=>{muted=!muted;sound.textContent=muted?'SOUND OFF':'SOUND ON';if(muted)clearInterval(timer);else if(state==='play')music(L)};menu.onclick=showMenu;function showMenu(){state='menu';ov.style.display='block';menu.style.display='none';hud.textContent='SELECT REEL';clearInterval(timer)}function begin(i){audio();L=i;state='play';ov.style.display='none';menu.style.display='block';p={x:42,y:FLOOR-46,vx:0,vy:0,on:0,face:1,inv:0};cam=0;lives=3;score=0;time=0;en=[];shots=[];mom=[];fx=[];goal=[8,7,6,10,8,7,6,9,7][i];const kinds=[['vamp','ghost','demon'],['gangster'],[],['merc','heavy'],['alien','drone'],['bandit'],[],['soldier'],[]][i];for(let q=0;q<goal;q++)if(kinds.length)en.push({type:kinds[q%kinds.length],x:190+q*95,y:FLOOR-41,hp:['demon','heavy','alien'].includes(kinds[q%kinds.length])?2:1,v:11+Math.random()*9});if(!kinds.length)for(let q=0;q<goal;q++)mom.push({x:185+q*115,name:['BIRTH','ARREST','VICTORY','PROTEST','REUNION','KISS','DANCE'][q%7],done:0});music(i);msg(reels[L][0]+' · '+goal+' TO GO')}function burst(x,y,col){for(let i=0;i<10;i++)fx.push({x,y,vx:(Math.random()-.5)*70,vy:-20-Math.random()*60,life:.25+Math.random()*.35,col})}function attack(){const bullet=[3,5,7].includes(L);shots.push({x:p.x+p.face*27,y:p.y+21,vx:p.face*(bullet?270:220),life:bullet?.9:.18,bullet});sfx(bullet?'shot':'camera');if(!bullet)burst(p.x+p.face*27,p.y+18,'#fff')}function update(dt){if(state!=='play')return;time+=dt;p.inv=Math.max(0,p.inv-dt);if(K.left){p.vx-=220*dt;p.face=-1}if(K.right){p.vx+=220*dt;p.face=1}if(!K.left&&!K.right)p.vx*=Math.pow(.002,dt);p.vx=Math.max(-92,Math.min(92,p.vx));if(K.jump&&p.on){p.vy=-150;p.on=0;K.jump=0;sfx('jump')}p.vy+=330*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y+46>=FLOOR){p.y=FLOOR-46;p.vy=0;p.on=1}cam=Math.max(0,p.x-88);if(K.action&&!K.a){attack();K.a=1}if(!K.action)K.a=0;shots.forEach(s=>{s.x+=s.vx*dt;s.life-=dt});shots=shots.filter(s=>s.life>0);en.forEach(e=>{let dx=p.x-e.x;e.x+=Math.sign(dx)*e.v*dt;if(Math.abs(dx)<17&&p.inv<=0){p.inv=.8;lives--;sfx('hit');if(lives<=0)begin(L)}shots.forEach(s=>{if(s.life>0&&Math.abs(s.x-e.x)<14){s.life=0;if(--e.hp<=0){goal--;score+=150;burst(e.x,e.y,'#ffe36a');sfx('score')}}})});en=en.filter(e=>e.hp>0);mom.forEach(m=>{if(!m.done&&Math.abs(p.x-m.x)<40&&K.action){m.done=1;goal--;score+=250;sfx('score');msg('FILMED: '+m.name)}});fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=160*dt;f.life-=dt});fx=fx.filter(f=>f.life>0);if(goal<=0){msg('REEL COMPLETE');goal=999;setTimeout(showMenu,650)}hud.textContent=reels[L][0]+' · '+goal+' LEFT · '+score+' · ♥'+lives}function cloud(x,y,s,c1,c2){rect(x,y,18*s,5*s,c2);rect(x+4*s,y-4*s,12*s,9*s,c1);rect(x+10*s,y-2*s,11*s,7*s,c1);rect(x+2*s,y+3*s,21*s,3*s,c2)}function mountain(x,y,w,h,c1,c2){for(let yy=0;yy<h;yy+=2){let ww=(yy/h)*w;rect(x-ww/2,y+yy,ww,2,(yy%4)?c1:c2)}}function tree(x,y,c1,c2){rect(x-2,y,4,18,'#442b20');rect(x-5,y+7,10,2,'#5c3726');rect(x-8,y-4,16,8,c2);rect(x-12,y,24,8,c1);rect(x-9,y+5,18,7,c2)}function skyline(base,sp,c1,c2,lit){for(let i=0;i<10;i++){const x=((i*43-cam*sp)%460+460)%460-45,h=36+(i*13)%62;rect(x,base-h,38,h,c2);rect(x+2,base-h+2,34,3,c1);for(let yy=base-h+9;yy<base-5;yy+=11)for(let xx=x+6;xx<x+34;xx+=10){const on=lit&&((i+xx+yy)%3);rect(xx,yy,4,5,on?'#f1cf67':'#111526')}}}function groundTiles(c1,c2,c3){rect(0,FLOOR,W,H-FLOOR,c1);for(let x=-((cam|0)%16);x<W;x+=16){rect(x,FLOOR,16,3,c2);rect(x,FLOOR+8,8,2,c3);rect(x+9,FLOOR+14,7,2,c2)}}function bg(){if(L===0){rect(0,0,W,H,'#0a0820');rect(0,0,W,55,'#11113a');for(let i=0;i<18;i++)rect((i*37)%W,(i*19)%55,1,1,'#b9c8ff');rect(250,15,24,24,'#d8d8b6');dither(250,15,24,24,'#d8d8b6','#b9b89d',3);mountain(65,62,120,58,'#21
