<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Man With A Movie Camera — 16-bit V2</title><style>*{box-sizing:border-box}html,body{margin:0;background:#090912;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.shell{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:#0b0b14}header{display:flex;justify-content:space-between;align-items:center;padding:max(8px,env(safe-area-inset-top)) 10px 7px;background:#141426;border-bottom:3px solid #5e3a97}.brand{font-weight:900;font-style:italic;color:#ffe05a;text-shadow:2px 2px #9d2f54;font-size:14px}.hud{font:800 10px monospace;color:#76d8ff}.stage{display:grid;place-items:center;min-height:0;padding:6px}.frame{position:relative;width:min(100%,900px);aspect-ratio:16/9;background:#000;border:4px solid #412f71;box-shadow:0 0 0 3px #b93273;overflow:hidden}.frame canvas{width:100%;height:100%;display:block;image-rendering:pixelated!important;image-rendering:crisp-edges!important;touch-action:none}.overlay{position:absolute;inset:0;z-index:5;background:#0b0b15f7;overflow:auto;padding:12px}.title{text-align:center}.title h1{font-size:clamp(28px,7vw,58px);line-height:.88;margin:4px 0;color:#ffe05a;text-shadow:4px 4px #9d2f54;font-style:italic}.title p{font:900 10px monospace;color:#8fdcff}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:850px;margin:12px auto}.level{border:3px solid #4f5f99;background:#171a32;color:#fff;padding:9px;text-align:left;min-height:82px;box-shadow:inset 3px 3px #7988c2,inset -3px -3px #070814}.level b{display:block;color:#ffe36a;font-size:12px}.level small{display:block;font-size:9px;line-height:1.25;color:#c1d8ec}.level em{display:block;color:#ff7bb0;font:800 8px monospace;margin-top:5px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px 8px max(8px,env(safe-area-inset-bottom));background:#0a0a12}.controls button{border:3px solid #4a5b88;background:#171d36;color:white;font-size:18px;font-weight:900;padding:12px;touch-action:none}.controls button:active{background:#ffe05a;color:#111}.toast{position:absolute;z-index:6;left:50%;top:10%;transform:translateX(-50%);display:none;background:#050508;border:3px solid #fff;padding:7px;font:900 10px monospace}.menu,.sound{position:absolute;z-index:7;top:8px;background:#11162a;color:#fff;border:2px solid #7181b5;padding:6px}.menu{right:8px;display:none}.sound{left:8px}@media(max-width:700px){.levels{grid-template-columns:1fr 1fr}.level{min-height:74px}.level b{font-size:10px}}</style></head><body><div class="shell"><header><div class="brand">MAN WITH A MOVIE CAMERA</div><div id="hud" class="hud">SELECT REEL</div></header><div class="stage"><div class="frame"><canvas id="game" width="320" height="180"></canvas><div id="toast" class="toast"></div><button id="sound" class="sound">SOUND ON</button><button id="menu" class="menu">REELS</button><div id="overlay" class="overlay"><div class="title"><h1>MAN WITH A<br>MOVIE CAMERA</h1><p>1994 ARCADE CUT · CHOOSE A GENRE</p></div><div id="levels" class="levels"></div></div></div></div><div class="controls"><button data-k="left">◀</button><button data-k="jump">▲</button><button data-k="action">●</button><button data-k="right">▶</button></div></div><script>(()=>{const C=document.getElementById('game'),G=C.getContext('2d'),ov=document.getElementById('overlay'),levels=document.getElementById('levels'),hud=document.getElementById('hud'),toast=document.getElementById('toast'),menu=document.getElementById('menu'),sound=document.getElementById('sound');G.imageSmoothingEnabled=false;const W=320,H=180,FLOOR=145,K={left:0,right:0,jump:0,action:0};const reels=[['HORROR','THE BLACK HOUSE','Vampires · ghosts · demons'],['NOIR','CITY OF SHADOWS','Gangsters · alleys · rain'],['DOCUMENTARY','ONE DAY ON EARTH','Birth · arrest · victory'],['ACTION','HARD TARGET','Rooftops · mercenaries'],['SCI-FI','ORBITAL 9','Aliens · drones · reactor'],['WESTERN','LAST LIGHT','Bandits · saloon · train'],['ROMANCE','BEFORE THE TRAIN','Rain · taxis · lovers'],['WAR','HILL 317','Trenches · bunkers · ridge'],['MUSICAL','ONE TAKE','Broadway · dancers · finale']];reels.forEach((r,i)=>{const b=document.createElement('button');b.className='level';b.innerHTML=`<b>${String(i+1).padStart(2,'0')} ${r[0]}</b><small>${r[2]}</small><em>${r[1]}</em>`;b.onclick=()=>begin(i);levels.appendChild(b)});let state='menu',L=0,p,en=[],shots=[],mom=[],fx=[],cam=0,goal=0,lives=3,score=0,time=0,last=performance.now(),muted=false,ac=null,timer=null;const rect=(x,y,w,h,c)=>{G.fillStyle=c;G.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};const line=(x1,y1,x2,y2,c,w=1)=>{G.strokeStyle=c;G.lineWidth=w;G.beginPath();G.moveTo(x1,y1);G.lineTo(x2,y2);G.stroke()};function msg(s){toast.textContent=s;toast.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>toast.style.display='none',800)}function audio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}function tone(f,d=.08,type='square',v=.03){if(muted)return;const a=audio(),o=a.createOscillator(),q=a.createGain();o.type=type;o.frequency.value=f;q.gain.value=v;o.connect(q);q.connect(a.destination);o.start();q.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}function sfx(k){if(k==='jump'){tone(280);setTimeout(()=>tone(420,.06,'square',.025),35)}if(k==='camera'){tone(1250,.025,'square',.045);tone(180,.05,'square',.02)}if(k==='shot'){tone(70,.08,'sawtooth',.05)}if(k==='hit'){tone(110,.1,'square',.05)}if(k==='score'){tone(650,.05);setTimeout(()=>tone(920,.07),50)}}function music(i){clearInterval(timer);if(muted)return;const roots=[110,98,147,123,130,110,147,82,165],seqs=[[0,3,7,10],[0,3,5,7],[0,4,7,9],[0,3,7,8],[0,2,7,10],[0,4,7,10],[0,4,7,11],[0,3,5,7],[0,4,7,9]],tem=[300,360,420,220,260,330,390,250,210];let n=0;timer=setInterval(()=>{tone(roots[i]*Math.pow(2,(seqs[i][n%4]+(n%8>3?12:0))/12),.09,i===1?'triangle':'square',.015);n++},tem[i])}sound.onclick=()=>{muted=!muted;sound.textContent=muted?'SOUND OFF':'SOUND ON';if(muted)clearInterval(timer);else if(state==='play')music(L)};menu.onclick=showMenu;function showMenu(){state='menu';ov.style.display='block';menu.style.display='none';hud.textContent='SELECT REEL';clearInterval(timer)}function begin(i){audio();L=i;state='play';ov.style.display='none';menu.style.display='block';p={x:42,y:FLOOR-44,vx:0,vy:0,on:0,face:1,inv:0};cam=0;lives=3;score=0;time=0;en=[];shots=[];mom=[];fx=[];goal=[8,7,6,10,8,7,6,9,7][i];const kinds=[['vamp','ghost','demon'],['gangster'],[],['merc','heavy'],['alien','drone'],['bandit'],[],['soldier'],[]][i];for(let q=0;q<goal;q++)if(kinds.length)en.push({type:kinds[q%kinds.length],x:190+q*95,y:FLOOR-39,hp:['demon','heavy','alien'].includes(kinds[q%kinds.length])?2:1,v:12+Math.random()*9});if(!kinds.length)for(let q=0;q<goal;q++)mom.push({x:185+q*112,name:['BIRTH','ARREST','VICTORY','PROTEST','REUNION','KISS','DANCE'][q%7],done:0});music(i);msg(reels[L][0]+' · '+goal+' TO GO')}function burst(x,y,col){for(let i=0;i<10;i++)fx.push({x,y,vx:(Math.random()-.5)*70,vy:-20-Math.random()*60,life:.25+Math.random()*.35,col})}function attack(){const bullet=[3,5,7].includes(L);shots.push({x:p.x+p.face*25,y:p.y+20,vx:p.face*(bullet?270:220),life:bullet?.9:.18,bullet});sfx(bullet?'shot':'camera');if(!bullet)burst(p.x+p.face*25,p.y+18,'#fff')}function update(dt){if(state!=='play')return;time+=dt;p.inv=Math.max(0,p.inv-dt);if(K.left){p.vx-=220*dt;p.face=-1}if(K.right){p.vx+=220*dt;p.face=1}if(!K.left&&!K.right)p.vx*=Math.pow(.002,dt);p.vx=Math.max(-92,Math.min(92,p.vx));if(K.jump&&p.on){p.vy=-150;p.on=0;K.jump=0;sfx('jump')}p.vy+=330*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y+44>=FLOOR){p.y=FLOOR-44;p.vy=0;p.on=1}cam=Math.max(0,p.x-88);if(K.action&&!K.a){attack();K.a=1}if(!K.action)K.a=0;shots.forEach(s=>{s.x+=s.vx*dt;s.life-=dt});shots=shots.filter(s=>s.life>0);en.forEach(e=>{let dx=p.x-e.x;e.x+=Math.sign(dx)*e.v*dt;if(Math.abs(dx)<17&&p.inv<=0){p.inv=.8;lives--;sfx('hit');if(lives<=0)begin(L)}shots.forEach(s=>{if(s.life>0&&Math.abs(s.x-e.x)<14){s.life=0;if(--e.hp<=0){goal--;score+=150;burst(e.x,e.y,'#ffe36a');sfx('score')}}})});en=en.filter(e=>e.hp>0);mom.forEach(m=>{if(!m.done&&Math.abs(p.x-m.x)<40&&K.action){m.done=1;goal--;score+=250;sfx('score');msg('FILMED: '+m.name)}});fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=160*dt;f.life-=dt});fx=fx.filter(f=>f.life>0);if(goal<=0){msg('REEL COMPLETE');goal=999;setTimeout(showMenu,650)}hud.textContent=reels[L][0]+' · '+goal+' LEFT · '+score+' · ♥'+lives}function bg(){const P=[['#09081a','#35152f','#5f2940'],['#171717','#6a6a6a','#2a2a2a'],['#4b87b0','#8fb8ae','#4f6d5d'],['#ce5d44','#62354b','#29344c'],['#06132d','#19416b','#18304b'],['#c46b33','#894528','#6a3724'],['#493157','#b35b72','#283b5f'],['#66705a','#46503e','#31362d'],['#3c2a51','#ae4772','#2d3358']][L];rect(0,0,W,H,P[0]);for(let layer=0;layer<3;layer++)for(let i=0;i<7;i++){let xx=((i*61-cam*[.15,.3,.55][layer])%520+520)%520-55,h=35+(i*17)%68;rect(xx,FLOOR-h,48,h,layer===0?'#1d2030':P[layer===1?1:2]);for(let yy=FLOOR-h+8;yy<FLOOR-6;yy+=12)for(let x=xx+7;x<xx+42;x+=12)rect(x,yy,4,5,(L===3||L===6||L===8)?'#e4c76c':'#121522')}if(L===0){for(let i=0;i<6;i++){let x=((i*88-cam*.8)%520+520)%520;rect(x,FLOOR-22,13,17,'#7d777d');rect(x+3,FLOOR-27,7,5,'#a5a0a5')}}if(L===1){for(let i=0;i<26;i++)line((i*17+time*55)%W,0,(i*17+time*55)%W-35,H,'#8f8f8f')}if(L===5)rect(0,FLOOR-8,W,8,'#a6582f');if(L===7){for(let i=0;i<5;i++){let x=((i*74-cam*.8)%420+420)%420;rect(x,FLOOR-18,60,10,'#30342c')}}rect(0,FLOOR,W,H-FLOOR,'#11131a')}function hero(){let x=p.x-cam,y=p.y,walk=Math.sin(time*10)*3,bob=Math.abs(Math.sin(time*10));G.save();G.translate(Math.round(x),Math.round(y+bob));if(p.face<0)G.scale(-1,1);const skin='#d3956b',skinD='#9d6248',j='#3f668f',jD='#29445f',pant='#222a3c',dark='#11131b';rect(-6,13,18,20,dark);rect(-5,13,16,17,jD);rect(-4,12,15,14,j);rect(-4,29,5,12,pant);rect(6,29,5,12,pant);rect(-5+walk*.15,40,7,3,dark);rect(6-walk*.15,40,7,3,dark);rect(-6,-1,13,13,skinD);rect(-5,0,12,11,skin);rect(-5,-2,12,4,'#2a211f');rect(-3,3,2,2,'#221818');rect(3,3,2,2,'#221818');rect(-1,8,5,2,skinD);rect(-10,15,4,12,skin);rect(11,15,4,10,skin);rect(8,10,18,10,'#101217');rect(22,12,12,6,'#353a43');rect(31,14,9,3,'#050607');rect(14,7,5,4,'#686f7a');rect(13,19,5,3,'#9399a1');rect(9,11,2,10,'#000');rect(18,11,2,8,'#5d626b');G.restore()}function enemy(e){let x=e.x-cam,y=e.y,b=Math.sin(time*7+e.x);G.save();G.translate(Math.round(x),Math.round(y+b));const k=e.type;if(k==='ghost'){rect(-8,-2,16,26,'#d6ecec');rect(-5,3,2,2,'#111');rect(4,3,2,2,'#111');rect(-8,23,5,5,'#d6ecec');rect(-2,23,5,5,'#d6ecec');rect(4,23,5,5,'#d6ecec');G.restore();return}if(k==='drone'){rect(-10,5,20,7,'#6b7a8e');rect(-14,7,28,2,'#26303e');rect(-2,11,4,4,'#e0506b');G.restore();return}let skin='#c58b67',shirt='#343740',pants='#1c1f28',hair='#1a1718';if(k==='vamp'){skin='#d1cad0';shirt='#24172a';pants='#121219';hair='#111'}if(k==='demon'){skin='#ae3b43';shirt='#76242f';pants='#3a151d';hair='#48131b'}if(k==='gangster'){shirt='#2d3036';pants='#16181d';hair='#151515'}if(k==='merc'){shirt='#4e584c';pants='#292f2c';hair='#251e18'}if(k==='heavy'){shirt='#525961';pants='#24282d';hair='#1b1b1b'}if(k==='alien'){skin='#77a98f';shirt='#344c49';pants='#1b3130';hair='#456a61'}if(k==='bandit'){shirt='#79432d';pants='#30231d';hair='#4f2e1f'}if(k==='soldier'){shirt='#5e684f';pants='#3c4336';hair='#342d20'}rect(-5,13,11,17,shirt);rect(-4,29,4,10,pants);rect(3,29,4,10,pants);rect(-5,38,6,3,'#111');rect(2,38,6,3,'#111');rect(-5,0,11,12,skin);rect(-5,-2,11,4,hair);rect(-3,4,2,2,'#151111');rect(3,4,2,2,'#151111');rect(-8,15,3,11,skin);rect(6,15,3,11,skin);if(k==='vamp'){rect(-2,9,1,3,'#fff');rect(3,9,1,3,'#fff')}if(k==='demon'){rect(-4,-5,2,5,'#f2c85b');rect(4,-5,2,5,'#f2c85b')}if(k==='gangster')rect(-7,-4,15,3,'#151515');if(['merc','soldier'].includes(k))rect(7,18,8,3,'#111');if(k==='bandit')rect(-7,-5,15,3,'#55301f');G.restore()}function moment(m){if(m.done)return;let x=m.x-cam;rect(x-13,FLOOR-25,26,25,'#51413b');rect(x-9,FLOOR-30,18,7,'#d2a37c');rect(x-6,FLOOR-22,12,12,'#748ca6');rect(x-16,FLOOR-38,32,4,'#ffe05a')}function draw(){bg();mom.forEach(moment);en.forEach(enemy);if(p)hero();shots.forEach(s=>{let x=s.x-cam;rect(x,s.y,s.bullet?5:8,s.bullet?2:5,s.bullet?'#ffe05a':'#fff')});fx.forEach(f=>rect(f.x-cam,f.y,2,2,f.col))}function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k,on=e=>{e.preventDefault();K[k]=1},off=e=>{e.preventDefault();K[k]=0};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')K.left=1;if(e.key==='ArrowRight'||e.key==='d')K.right=1;if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')K.jump=1;if(e.key==='z'||e.key==='x')K.action=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')K.left=0;if(e.key==='ArrowRight'||e.key==='d')K.right=0;if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')K.jump=0;if(e.key==='z'||e.key==='x')K.action=0})})();</script></body></html>
