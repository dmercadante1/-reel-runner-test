<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09101a"><title>Man With A Movie Camera — Gothic Horror</title><style>/*STYLE*/</style></head>
<body><div id="shell"><header>MAN WITH A MOVIE CAMERA<span>GOTHIC HORROR</span></header><main><div id="game" role="application" aria-label="Gothic Horror game"></div><div id="touch"><div class="left"><button data-input="left" aria-label="Move left">◀</button><button data-input="right" aria-label="Move right">▶</button></div><div class="right"><button data-input="jump" aria-label="Jump">↑</button><button class="camera" data-input="beam" aria-label="Hold to capture">FILM</button></div></div><section id="overlay"><h1 id="overlay-title">GOTHIC HORROR</h1><p id="overlay-copy">Checking artwork and starting the game…</p><button id="start" hidden>PRESS START</button><button id="reload" hidden>RELOAD</button></section></main><footer>
<div class="meters" aria-label="Game HUD">
<div id="life-meter" class="meter" role="meter" aria-label="Life" aria-valuemin="0" aria-valuemax="5" aria-valuenow="5"><span class="meter-label">LIFE</span><span id="hearts" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><strong id="life-value">5/5</strong></div>
<div id="film-meter" class="meter"><label class="meter-label" for="film">FILM</label><span class="film-track"><progress id="film" value="100" max="100" aria-valuetext="100 percent film remaining"></progress></span><strong id="film-value">100</strong></div>
<div class="meter capture-meter"><span class="meter-label">CAPTURED</span><strong id="capture-value">0/6</strong><span id="capture-slots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
</div>
<div class="utility"><span id="hint">← → / A D MOVE · ↑ / W JUMP · HOLD SPACE / C TO FILM</span><span id="checkpoint">FIND THE FAR GATE</span><span id="build"></span><div class="buttons"><button id="pause" aria-label="Pause game">PAUSE</button><button id="fullscreen">FULLSCREEN</button></div></div>
<span id="status" class="sr-only" role="status" aria-live="polite">LOADING</span>
</footer></div><noscript>This game needs JavaScript enabled.</noscript>
<!--SCRIPTS-->
</body></html>
