<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Man With A Movie Camera 16-bit</title><style>*{box-sizing:border-box}html,body{margin:0;background:#07070d;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.shell{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:#0a0a12}header{display:flex;justify-content:space-between;align-items:center;padding:max(8px,env(safe-area-inset-top)) 10px 7px;background:#131323;border-bottom:3px solid #56358c}.brand{font-weight:900;font-style:italic;color:#ffd84a;text-shadow:2px 2px #9c274c;font-size:14px}.hud{font:800 10px monospace;color:#70d7ff}.stage{display:grid;place-items:center;padding:6px;min-height:0}.frame{position:relative;width:min(100%,900px);aspect-ratio:16/9;border:4px solid #3d2b6b;box-shadow:0 0 0 3px #b22f6d;background:#000;overflow:hidden}.frame canvas{width:100%;height:100%;display:block;image-rendering:pixelated!important;image-rendering:crisp-edges!important;touch-action:none}.overlay{position:absolute;inset:0;z-index:5;background:#0a0a13f2;overflow:auto;padding:12px}.title{text-align:center}.title h1{font-size:clamp(28px,7vw,58px);line-height:.88;margin:4px 0;color:#ffd84a;text-shadow:4px 4px #992d4e;font-style:italic}.title p{font:900 10px monospace;color:#8fd7ff}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:850px;margin:12px auto}.level{border:3px solid #4d5790;background:#15182e;color:#fff;padding:9px;text-align:left;min-height:82px;box-shadow:inset 3px 3px #7280bd,inset -3px -3px #070814}.level b{display:block;color:#ffe36a;font-size:12px}.level small{display:block;font-size:9px;line-height:1.25;color:#c0d9ec}.level em{display:block;color:#ff79ac;font:800 8px monospace;margin-top:5px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px 8px max(8px,env(safe-area-inset-bottom));background:#0a0a12}.controls button{border:3px solid #485985;background:#171c35;color:white;font-size:18px;font-weight:900;padding:12px;touch-action:none}.controls button:active{background:#ffd84a;color:#111}.toast{position:absolute;z-index:6;left:50%;top:10%;transform:translateX(-50%);display:none;background:#050508;border:3px solid #fff;padding:7px;font:900 10px monospace}.menu{position:absolute;z-index:7;top:8px;right:8px;display:none;background:#11162a;color:#fff;border:2px solid #7181b5;padding:6px}.sound{position:absolute;z-index:7;top:8px;left:8px;background:#11162a;color:#fff;border:2px solid #7181b5;padding:6px}@media(max-width:700px){.levels{grid-template-columns:1fr 1fr}.level{min-height:74px}.level b{font-size:10px}}</style></head><body><div class="shell"><header><div class="brand">MAN WITH A MOVIE CAMERA</div><div id="hud" class="hud">SELECT REEL</div></header><div class="stage"><div class="frame"><canvas id="game" width="320" height="180"></canvas><div id="toast" class="toast"></div><button id="sound" class="sound">SOUND ON</button><button id="menu" class="menu">REELS</button><div id="overlay" class="overlay"><div class="title"><h1>MAN WITH A<br>MOVIE CAMERA</h1><p>16-BIT ARCADE CUT · CHOOSE A GENRE</p></div><div id="levels" class="levels"></div></div></div></div><div class="controls"><button data-k="left">◀</button><button data-k="jump">▲</button><button data-k="action">●</button><button data-k="right">▶</button></div></div><script>(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),ov=document.getElementById('overlay'),levels=document.getElementById('levels'),hud=document.getElementById('hud'),toast=document.getElementById('toast'),menu=document.getElementById('menu'),sound=document.getElementById('sound');g.imageSmoothingEnabled=false;const W=320,H=180,G=145,K={left:0,right:0,jump:0,action:0};const reels=[['HORROR','THE BLACK HOUSE','Vampires · ghosts · demons'],['NOIR','CITY OF SHADOWS','Gangsters · alleys · rain'],['DOCUMENTARY','ONE DAY ON EARTH','Birth · arrest · victory'],['ACTION','HARD TARGET','Rooftops · mercenaries'],['SCI-FI','ORBITAL 9','Aliens · drones · reactor'],['WESTERN','LAST LIGHT','Bandits · saloon · train'],['ROMANCE','BEFORE THE TRAIN','Rain · taxis · lovers'],['WAR','HILL 317','Trenches · bunkers · ridge'],['MUSICAL','ONE TAKE','Broadway · dancers · finale']];reels.forEach((r,i)=>{const b=document.createElement('button');b.className='level';b.innerHTML=`<b>${String(i+1).padStart(2,'0')} ${r[0]}</b><small>${r[2]}</small><em>${r[1]}</em>`;b.onclick=()=>begin(i);levels.appendChild(b)});let state='menu',L=0,p,en=[],shots=[],mom=[],fx=[],cam=0,goal=0,lives=3,score=0,time=0,last=performance.now(),muted=false,ac=null,mTimer=null;const rect=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};const line=(x1,y1,x2,y2,col)=>{g.strokeStyle=col;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()};const msg=s=>{toast.textContent=s;toast.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>toast.style.display='none',800)};function audio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}function tone(f,d=.08,type='square',v=.035){if(muted)return;let a=audio(),o=a.createOscillator(),q=a.createGain();o.type=type;o.frequency.value=f;q.gain.value=v;o.connect(q);q.connect(a.destination);o.start();q.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}function sfx(k){if(k==='jump'){tone(300);setTimeout(()=>tone(430,.07,'square',.03),35)}if(k==='camera'){tone(1200,.03,'square',.04);tone(200,.05,'square',.02)}if(k==='hit'){tone(100,.1,'square',.05)}if(k==='shot'){tone(75,.08,'sawtooth',.05)}if(k==='score'){tone(650,.06);setTimeout(()=>tone(900,.07),55)}}function music(i){clearInterval(mTimer);if(muted)return;const root=[110,98,147,123,130,110,147,82,165][i],seq=[[0,3,7,10],[0,3,5,7],[0,4,7,9],[0,3,7,8],[0,2,7,10],[0,4,7,10],[0,4,7,11],[0,3,5,7],[0,4,7,9]][i];let n=0;mTimer=setInterval(()=>{tone(root*Math.pow(2,(seq[n%4]+(n%8>3?12:0))/12),.09,i===1?'triangle':'square',.018);n++},[300,360,420,220,260,330,390,250,210][i])}sound.onclick=()=>{muted=!muted;sound.textContent=muted?'SOUND OFF':'SOUND ON';if(muted)clearInterval(mTimer);else if(state==='play')music(L)};menu.onclick=showMenu;function showMenu(){state='menu';ov.style.display='block';menu.style.display='none';hud.textContent='SELECT REEL';clearInterval(mTimer)}function begin(i){audio();L=i;state='play';ov.style.display='none';menu.style.display='block';p={x:38,y:G-42,vx:0,vy:0,on:0,face:1,inv:0};cam=0;lives=3;score=0;time=0;en=[];shots=[];mom=[];fx=[];goal=[8,7,6,10,8,7,6,9,7][i];const kinds=[['vamp','ghost','demon'],['gangster'],[],['merc','heavy'],['alien','drone'],['bandit'],[],['soldier'],[]][i];for(let q=0;q<goal;q++)if(kinds.length)en.push({type:kinds[q%kinds.length],x:190+q*92,y:G-39,hp:['demon','heavy','alien'].includes(kinds[q%kinds.length])?2:1,v:12+Math.random()*10});if(!kinds.length)for(let q=0;q<goal;q++)mom.push({x:185+q*110,name:['BIRTH','ARREST','VICTORY','PROTEST','REUNION','KISS','DANCE'][q%7],done:0});music(i);msg(reels[L][0]+' · '+goal+' TO GO')}function burst(x,y,col){for(let i=0;i<10;i++)fx.push({x,y,vx:(Math.random()-.5)*70,vy:-20-Math.random()*60,life:.25+Math.random()*.35,col})}function attack(){const bullet=[3,5,7].includes(L);shots.push({x:p.x+p.face*22,y:p.y+19,vx:p.face*(bullet?260:220),life:bullet?.9:.18,bullet});sfx(bullet?'shot':'camera');if(!bullet)burst(p.x+p.face*22,p.y+18,'#fff')}function update(dt){if(state!=='play')return;time+=dt;p.inv=Math.max(0,p.inv-dt);if(K.left){p.vx-=220*dt;p.face=-1}if(K.right){p.vx+=220*dt;p.face=1}if(!K.left&&!K.right)p.vx*=Math.pow(.002,dt);p.vx=Math.max(-90,Math.min(90,p.vx));if(K.jump&&p.on){p.vy=-150;p.on=0;K.jump=0;sfx('jump')}p.vy+=330*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y+42>=G){p.y=G-42;p.vy=0;p.on=1}cam=Math.max(0,p.x-85);if(K.action&&!K.a){attack();K.a=1}if(!K.action)K.a=0;shots.forEach(s=>{s.x+=s.vx*dt;s.life-=dt});shots=shots.filter(s=>s.life>0);en.forEach(e=>{let dx=p.x-e.x;e.x+=Math.sign(dx)*e.v*dt;if(Math.abs(dx)<16&&p.inv<=0){p.inv=.8;lives--;sfx('hit');if(lives<=0)begin(L)}shots.forEach(s=>{if(s.life>0&&Math.abs(s.x-e.x)<14){s.life=0;if(--e.hp<=0){goal--;score+=150;burst(e.x,e.y,'#ffd85a');sfx('score')}}})});en=en.filter(e=>e.hp>0);mom.forEach(m=>{if(!m.done&&Math.abs(p.x-m.x)<40&&K.action){m.done=1;goal--;score+=250;sfx('score');msg('FILMED: '+m.name)}});fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=160*dt;f.life-=dt});fx=fx.filter(f=>f.life>0);if(goal<=0){msg('REEL COMPLETE');goal=999;setTimeout(showMenu,650)}hud.textContent=reels[L][0]+' · '+goal+' LEFT · '+score+' · ♥'+lives}function bg(){const pals=[['#0b0a1c','#3b1735','#6a2942'],['#151515','#696969','#252525'],['#4d89b5','#91bdb5','#4c6d5e'],['#d35c43','#63334d','#28324c'],['#06122d','#19406a','#17324f'],['#c76f35','#8a4728','#6c3824'],['#4c3159','#b85f75','#263b62'],['#66705a','#46503e','#2f342b'],['#3c2851','#b24975','#2b3156']][L];rect(0,0,W,H,pals[0]);for(let k=0;k<3;k++)for(let i=0;i<7;i++){let xx=((i*61-cam*[.15,.3,.55][k])%520+520)%520-55,h=35+(i*17)%68;rect(xx,G-h,48,h,k===0?'#1e2030':pals[k===1?1:2]);for(let y=G-h+8;y<G-6;y+=12)for(let x=xx+7;x<xx+42;x+=12)rect(x,y,4,5,(L===3||L===6||L===8)?'#e4c76c':'#121522')}if(L===0){for(let i=0;i<6;i++){let x=((i*88-cam*.8)%520+520)%520;rect(x,G-22,13,17,'#7d777d');rect(x+3,G-27,7,5,'#a5a0a5')}}if(L===1){for(let i=0;i<30;i++)line((i*17+time*55)%W,0,(i*17+time*55)%W-35,H,'#bdbdbd')}if(L===5)rect(0,G-8,W,8,'#a6582f');if(L===7){for(let i=0;i<5;i++){let x=((i*74-cam*.8)%420+420)%420;rect(x,G-18,60,10,'#30342c')}}rect(0,G,W,H-G,'#11131a')}function hero(){let x=p.x-cam,y=p.y,walk=Math.sin(time*10)*3,bob=Math.abs(Math.sin(time*10));g.save();g.translate(Math.round(x),Math.round(y+bob));if(p.face<0)g.scale(-1,1);const skin='#d3956b',skinD='#9d6248',j='#3e668f',jD='#29445f',pant='#222a3c',dark='#11131b';rect(-5,13,16,18,jD);rect(-4,12,15,14,j);rect(-3,28,5,12,pant);rect(5,28,5,12,pant);rect(-4+walk*.15,39,7,3,dark);rect(5-walk*.15,39,7,3,dark);rect(-5,-1,12,12,skin);rect(-5,-2,12,4,'#2a211f');rect(-3,3,2,2,'#221818');rect(3,3,2,2,'#221818');rect(-1,8,5,2,skinD);rect(-9,15,4,12,skin);rect(11,15,4,10,skin);rect(8,11,16,9,'#17191e');rect(21,13,10,5,'#343942');rect(29,14,8,3,'#0a0b0e');rect(13,8,5,4,'#575e69');rect(12,18,5,3,'#8b9199');rect(9,12,2,8,'#050506');g.restore()}function enemy(e){let x=e.x-cam,y=e.y,b=Math.sin(time*7+e.x);g.save();g.translate(Math.round(x),Math.round(y+b));let k=e.type;if(k==='ghost'){rect(-7,-2,14,25,'#cfe7e8');rect(-4,3,2,2,'#101010');rect(3,3,2,2,'#101010');rect(-7,22,4,4,'#cfe7e8');rect(-1,22,4,4,'#cfe7e8');rect(5,22,4,4,'#cfe7e8');g.restore();return}if(k==='drone'){rect(-10,5,20,7,'#68798d');rect(-14,7,28,2,'#252f3c');rect(-2,11,4,4,'#d94b68');g.restore();return}let skin='#c48a66',shirt='#343740',pant='#17191e',hat='#17171a';if(k==='vamp'){skin='#d6cfd3';shirt='#211526';pant='#101015'}if(k==='demon'){skin='#a83c43';shirt='#6f2430';pant='#3a151d'}if(k==='merc'){shirt='#4b584d';pant='#252c27'}if(k==='heavy'){shirt='#545a60';pant='#272c31'}if(k==='alien'){skin='#6fa38b';shirt='#344c49';pant='#18302d'}if(k==='bandit'){shirt='#77442d';pant='#35251d';hat='#5d321f'}if(k==='soldier'){shirt='#5a644c';pant='#30372b';hat='#46513d'}rect(-6,11,13,17,shirt);rect(-4,27,4,12,pant);rect(3,27,4,12,pant);rect(-5,-1,11,12,skin);rect(-6,-2,13,4,hat);rect(-3,3,2,2,'#171313');rect(3,3,2,2,'#171313');rect(-1,8,4,2,'#774b3e');rect(-10,14,4,12,skin);rect(7,14,4,12,skin);if(k==='vamp'){rect(-1,9,1,3,'#fff');rect(3,9,1,3,'#fff')}if(k==='demon'){rect(-5,-7,3,6,'#e3b748');rect(3,-7,3,6,'#e3b748')}if(['gangster','merc','heavy','bandit','soldier'].includes(k))rect(8,18,9,3,'#111');g.restore()}function draw(){g.save();bg();mom.forEach(m=>{if(m.done)return;let x=m.x-cam;rect(x-10,G-27,20,18,'#d5c099');rect(x-6,G-34,12,8,'#c98966');rect(x-14,G-42,28,3,'#ffe36b');g.fillStyle='#fff';g.font='5px monospace';g.textAlign='center';g.fillText(m.name,x,G-45)});en.forEach(enemy);shots.forEach(s=>rect(s.x-cam,s.y, s.bullet?5:7, s.bullet?2:7, s.bullet?'#ffd25c':'#fff'));fx.forEach(f=>rect(f.x-cam,f.y,2,2,f.col));hero();g.restore()}function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k,down=e=>{e.preventDefault();K[k]=1;audio()},up=e=>{e.preventDefault();K[k]=0};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')K.left=1;if(e.key==='ArrowRight'||e.key==='d')K.right=1;if(e.key==='ArrowUp'||e.key==='w')K.jump=1;if(e.code==='Space')K.action=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')K.left=0;if(e.key==='ArrowRight'||e.key==='d')K.right=0;if(e.key==='ArrowUp'||e.key==='w')K.jump=0;if(e.code==='Space')K.action=0});})();</script></body></html>
