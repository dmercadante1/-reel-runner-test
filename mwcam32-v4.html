ById('hud'),toast=document.getElementById('toast'),menu=document.getElementById('menu'),sound=document.getElementById('sound');g.imageSmoothingEnabled=false;const W=640,H=360,F=286,K={left:0,right:0,jump:0,action:0};const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));const reels=[['HORROR','THE BLACK HOUSE','Moonlit manor · crypt · monsters'],['NOIR','CITY OF SHADOWS','Rainy downtown · alleys · gangsters'],['DOCUMENTARY','ONE DAY ON EARTH','Hospital · courthouse · stadium · street'],['ACTION','HARD TARGET','High-rise rooftops · freeway · mercenaries'],['SCI-FI','ORBITAL 9','Alien planet · megastructures · moons'],['WESTERN','LAST LIGHT','Desert mesas · frontier town · train'],['ROMANCE','BEFORE THE TRAIN','European city · rain · station'],['WAR','HILL 317','Trenches · ruined village · ridge'],['MUSICAL','ONE TAKE','Neon theater district · stage · dancers']];reels.forEach((r,i)=>{let b=document.createElement('button');b.className='level';b.innerHTML=`<b>${String(i+1).padStart(2,'0')} ${r[0]}</b><small>${r[2]}</small><em>${r[1]}</em>`;b.onclick=()=>begin(i);levels.appendChild(b)});let state='menu',L=0,p,en=[],shots=[],mom=[],fx=[],cam=0,goal=0,lives=3,score=0,time=0,last=performance.now(),muted=false,ac=null,timer=null;const rect=(x,y,w,h,c,a=1)=>{g.globalAlpha=a;g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));g.globalAlpha=1};const poly=(pts,c,a=1)=>{g.globalAlpha=a;g.fillStyle=c;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fill();g.globalAlpha=1};const line=(x1,y1,x2,y2,c,w=1,a=1)=>{g.globalAlpha=a;g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.globalAlpha=1};function msg(s){toast.textContent=s;toast.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>toast.style.display='none',900)}function audio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='susp '+goal+' TO GO')}function burst(x,y,col){for(let i=0;i<14;i++)fx.push({x,y,vx:R(-120,120),vy:R(-130,30),life:R(.3,.7),col})}function attack(){let bullet=[3,5,7].includes(L);shots.push({x:p.x+p.face*48,y:p.y+34,vx:p.face*(bullet?540:430),life:bullet?.9:.18,bullet});sfx(bullet?'shot':'camera');if(!bullet)burst(p.x+p.face*48,p.y+30,'#fff')}function update(dt){if(state!=='play')return;time+=dt;p.inv=Math.max(0,p.inv-dt);if(K.left){p.vx-=440*dt;p.face=-1}if(K.right){p.vx+=440*dt;p.face=1}if(!K.left&&!K.right)p.vx*=Math.pow(.003,dt);p.vx=cl(p.vx,-190,190);if(K.jump&&p.on){p.vy=-315;p.on=0;K.jump=0;sfx('jump')}p.vy+=720*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y+86>=F){p.y=F-86;p.vy=0;p.on=1}cam=Math.max(0,p.x-205);if(K.action&&!K.a){attack();K.a=1}if(!K.action)K.a=0;shots.forEach(s=>{s.x+=s.vx*dt;s.life-=dt});shots=shots.filter(s=>s.life>0);en.forEach(e=>{let dx=p.x-e.x;e.x+=Math.sign(dx)*e.v*dt;if(Math.abs(dx)<34&&p.inv<=0){p.inv=.9;lives--;sfx('hit');if(lives<=0)begin(L)}shots.forEach(s=>{if(s.life>0&&Math.abs(s.x-e.x)<31){s.life=0;if(--e.hp<=0){goal--;score+=150;burst(e.x,e.y,'#ffd66a');sfx('score')}}})});en=en.filter(e=>e.hp>0);mom.forEach(m=>{if(!m.done&&Math.abs(p.x-m.x)<80&&K.action){m.done=1;goal--;score+=250;sfx('score');msg('FILMED: '+m.name)}});fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=280*dt;f.life-=dt});fx=fx.filter(f=>f.life>0);if(goal<=0){msg('REEL COMPLETE');goal=999;setTimeout(showMenu,700)}hud.textContent=reels[L][0]+' · '+goal+' LEFT · '+score+' · ♥'+lives}function sky(top,bot){let q=g.createLinearGradient(0,0,0,F);q.addColorStop(0,top);q.addColorStop(1,bot);g.fillStyle=q;g.fillRect(0,0,W,H)}function moon(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function cityBuilding(x,y,w,h,base,light){let q=g.createLinearGradient(x,y,x+w,y);q.addColorStop(0,'#10131a');q.addColorStop(.45,base);q.addColorStop(1,'#090b10');g.fillStyle=q;g.fillRect(x,y,w,h);rect(x+3,y+3,w-6,3,'#ffffff18');for(let yy=y+14;yy<y+h-10;yy+=18)for(let xx=x+9;xx<x+w-9
